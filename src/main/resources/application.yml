spring:
  datasource:
    url: jdbc:mysql://localhost:3306/vegetable_db?serverTimezone=UTC&useSSL=false
    username: root
    password: a1b4c6d9
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      filter:
        stat:
          enabled: true
          log-slow-sql: true
        slf4j:
          enabled: true
  freemarker:
    cache: false

mybatis:
  type-aliases-package: org.example.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    org.mybatis: DEBUG
    com.alibaba.druid: DEBUG

server:
  port: 8080
  error:
    include-stacktrace: always